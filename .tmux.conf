# ==========================
# tmux 設定ファイル
# ==========================

# ---------------------------
# 基本設定
# ---------------------------

# デフォルトシェルを設定
set-option -g default-shell /opt/homebrew/bin/fish

# 256色端末を使用
set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Escキーの遅延を解消
set-option -sg escape-time 0

# ウィンドウとペインのインデックスを1から始める
set-option -g base-index 1
set-window-option -g pane-base-index 1

# ウィンドウを閉じた時に番号を詰める
set-option -g renumber-windows on

# スクロールバッファサイズを増やす
set-option -g history-limit 10000

# ---------------------------
# キーバインド設定
# ---------------------------

# prefixキーをC-aに変更（C-bのデフォルトを解除）
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# 設定ファイルをリロード
bind r source-file ~/.tmux.conf \; display "設定をリロードしました!"

# ペイン分割
bind / split-window -h -c "#{pane_current_path}"
bind . split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新しいウィンドウで現在のパスを引き継ぐ
bind c new-window -c "#{pane_current_path}"

# ペイン間の移動（Vimライク）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインのリサイズ（Vimライク、連続入力可能）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ペインの最大化/元に戻す
bind z resize-pane -Z

# ---------------------------
# マウス設定
# ---------------------------

# マウス操作を有効化
set-option -g mouse on

# ---------------------------
# コピーモード設定
# ---------------------------

# コピーモードでViキーバインドを使用
set-window-option -g mode-keys vi

# コピーモードのキーバインド（Vimライク）
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# コピーモードに入る
bind [ copy-mode
bind ] paste-buffer

# ---------------------------
# ステータスバー設定
# ---------------------------

# ステータスバーを有効化
set-option -g status on

# ステータスバーの更新間隔（秒）
set-option -g status-interval 1

# ステータスバーの位置
set-option -g status-position bottom

# ステータスバーの色（iTerm2のカラースキームを使用）
set-option -g status-style bg=color0,fg=color255

# 左側のステータス（ブルーアクセント）
# #[fg=black,bg=blue,bold]
set-option -g status-left-length 40
set-option -g status-left "#[fg=color0,bg=color68,bold] #S #[fg=color75,bg=color68]\uE0BE #[fg=color0,bg=color75] #I:#P #[fg=color214,bg=color75]\uE0BE "

# 右側のステータス（ブルーアクセント）
set-option -g status-right-length 60
set-option -g status-right "#[fg=color0,bg=color68]\uE0BC #[fg=color255,bg=color68] %Y/%m/%d (%a) %H:%M:%S"

# ウィンドウリストの設定
set-window-option -g window-status-format "#[fg=color0,bg=color214] #I:#W "
set-window-option -g window-status-current-format "#[fg=color255,bg=color196,bold] #I:#W #[default]"

# ウィンドウの区切り
set-window-option -g window-status-separator ""

# ---------------------------
# ペイン設定
# ---------------------------

# アクティブなペインの境界線の色
set-option -g pane-active-border-style fg=colour27

# 非アクティブなペインの境界線の色
set-option -g pane-border-style fg=colour240

# ---------------------------
# その他の設定
# ---------------------------

# ウィンドウ名の自動変更を無効化
set-window-option -g automatic-rename off
set-option -g allow-rename off

# ビジュアルベル（音を鳴らさない）
set-option -g visual-bell off
set-option -g bell-action none

# フォーカスイベントを有効化（Vim等でのファイル更新検知に必要）
set-option -g focus-events on

# クリップボード連携（macOS）
set-option -g set-clipboard on
